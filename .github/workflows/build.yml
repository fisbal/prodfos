name: Build ProDFOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version | tee $RUNNER_TEMP/log.txt
      - name: Get packages
        run: flutter pub get 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - name: Build APK
        env:
          # Permanent signing key password (repo secret). Without it the APK is
          # debug-signed and Android will refuse to update an installed copy.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then echo "Signing with the permanent ProDFOS key" | tee -a $RUNNER_TEMP/log.txt; else echo "WARNING: ANDROID_KEYSTORE_PASSWORD secret missing - debug signing" | tee -a $RUNNER_TEMP/log.txt; fi
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProDFOS-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          touch $RUNNER_TEMP/log.txt
          mkdir -p $RUNNER_TEMP/pub && cd $RUNNER_TEMP/pub
          git init -q -b ci-logs-android
          cp $RUNNER_TEMP/log.txt .
          git -c user.name=ci -c user.email=ci@local add log.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "android log ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:ci-logs-android

  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get 2>&1 | tee $RUNNER_TEMP/log.txt
      - name: Build Windows
        run: flutter build windows --release 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ProDFOS-windows
          path: build/windows/x64/runner/Release/
      - name: Publish build log
        if: always()
        run: |
          touch $RUNNER_TEMP/log.txt
          mkdir -p $RUNNER_TEMP/pub && cd $RUNNER_TEMP/pub
          git init -q -b ci-logs-windows
          cp $RUNNER_TEMP/log.txt .
          git -c user.name=ci -c user.email=ci@local add log.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "windows log ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:ci-logs-windows

  web:
    name: Web app (GitHub Pages)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get 2>&1 | tee $RUNNER_TEMP/log.txt
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - name: Build web
        run: flutter build web --release --base-href /prodfos/ 2>&1 | tee -a $RUNNER_TEMP/log.txt
      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "ProDFOS web ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:gh-pages
      - name: Publish build log
        if: always()
        run: |
          touch $RUNNER_TEMP/log.txt
          mkdir -p $RUNNER_TEMP/pub && cd $RUNNER_TEMP/pub
          git init -q -b ci-logs-web
          cp $RUNNER_TEMP/log.txt .
          git -c user.name=ci -c user.email=ci@local add log.txt
          git -c user.name=ci -c user.email=ci@local commit -qm "web log ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:ci-logs-web

  release:
    name: Publish downloads
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package files
        run: |
          cp dist/ProDFOS-android-apk/app-release.apk ProDFOS-android.apk
          (cd dist/ProDFOS-windows && zip -qr ../../ProDFOS-windows.zip .)
          ls -la *.apk *.zip
      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProDFOS latest build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of commit ${{ github.sha }}.
            - **ProDFOS-android.apk**: install on Android
            - **ProDFOS-windows.zip**: extract all, then run prodfos.exe
            - **Web app**: https://fisbal.github.io/prodfos/
          files: |
            ProDFOS-android.apk
            ProDFOS-windows.zip
