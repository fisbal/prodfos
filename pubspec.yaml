name: prodfos
description: "ProDFOS — The AI-native PDF reader. Read smarter. Not harder."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^27.1.48
  syncfusion_flutter_pdf: ^27.1.48
  syncfusion_flutter_signaturepad: ^27.1.48
  printing: ^5.13.3
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  google_mlkit_document_scanner: ^0.5.0
  image: ^4.3.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  go_router: ^14.3.0
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
