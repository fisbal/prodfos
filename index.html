<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/prodfos/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ProDFOS — the AI-native PDF reader. Read smarter. Not harder.">
  <meta name="theme-color" content="#07070A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ProDFOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ProDFOS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#07070A">
  <!-- pdf.js (Mozilla) — self-hosted engine used by the PDF viewer and page thumbnails -->
  <script src="assets/assets/pdfjs/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/assets/pdfjs/pdf.worker.min.js";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
